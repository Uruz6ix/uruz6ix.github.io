---
layout: rain
title: Rain
permalink: /rain/
sitemap: false
---

<div
  id="rain-app"
  v-cloak
  data-root="{{ '/assets/interactive/rain/' | relative_url }}"
>
  <div
    ref="scene"
    class="rain-scene"
    @pointermove="onPointerMove"
    @pointerleave="onPointerLeave"
  >
    <img
      v-for="layer in staticLayers"
      :key="layer"
      class="rain-layer rain-static"
      :src="layer"
      alt=""
      draggable="false"
    >

    <img
      v-for="leaf in leaves"
      :key="leaf.id"
      class="rain-layer rain-leaf"
      :src="leaf.src"
      :style="leafStyle(leaf)"
      alt=""
      draggable="false"
    >

    <div class="rain-drops" aria-hidden="true">
      <img
        v-for="drop in drops"
        :key="drop.id"
        class="rain-drop"
        :src="drop.src"
        :style="dropStyle(drop)"
        alt=""
        draggable="false"
      >
    </div>
  </div>
</div>
