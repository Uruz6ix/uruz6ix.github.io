<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Rain</title>

  <link
    rel="stylesheet"
    href="{{ '/assets/interactive/rain/rain.css?v=t14' | relative_url }}"
  >
</head>

<body>
  <div
    id="rain-app"
    v-cloak
    data-root="{{ '/assets/interactive/rain/' | relative_url }}"
  >
    <div
      ref="scene"
      v-if="ready"
      class="rain-scene"
      @pointerdown="onPointerDown"
      @pointermove="onPointerMove"
      @pointerleave="onPointerLeave"
      @pointerup="onPointerEnd"
      @pointercancel="onPointerEnd"
      @touchstart.prevent="onTouchStart"
      @touchmove.prevent="onTouchMove"
      @touchend="onTouchEnd"
      @touchcancel="onTouchEnd"
    >
      <!-- static1：普通静态底层 -->
<img
  class="rain-layer rain-static-background"
  :src="staticLayers[0]"
  alt=""
  draggable="false"
>

<!-- static2：始终模糊的人像 -->
<img
  class="rain-layer rain-static-portrait rain-static-portrait-blur"
  :src="staticLayers[1]"
  alt=""
  draggable="false"
>

<!-- static2：指针附近显示的清晰人像 -->
<img
  class="rain-layer rain-static-portrait rain-static-portrait-clear"
  :src="staticLayers[1]"
  :style="portraitRevealStyle()"
  alt=""
  draggable="false"
>

      <img
        v-for="leaf in leaves"
        :key="leaf.id"
        class="rain-layer rain-leaf"
        :src="leaf.src"
        :style="leafStyle(leaf)"
        alt=""
        draggable="false"
      >

      <div class="rain-drops" aria-hidden="true">
        <img
          v-for="drop in drops"
          :key="drop.id"
          class="rain-drop"
          :src="drop.src"
          :style="dropStyle(drop)"
          alt=""
          draggable="false"
        >
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="{{ '/assets/interactive/rain/rain.js?v=t15' | relative_url }}"></script>
</body>
</html>
